<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Club</title>
    <!-- Inline, so there is no favicon request to 404 on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23191c18'/%3E%3Crect x='4' y='3' width='2.5' height='10' rx='1' fill='%232c5f72'/%3E%3Crect x='9.5' y='3' width='2.5' height='10' rx='1' fill='%237d2e46'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600&display=swap&subset=latin"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The theme has to be on <html> before the first paint. Left to React it
      lands one frame late, and a dark-mode member gets a white flash on every
      reload. Same key and same fallback as useTheme.
    -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('bookclub.theme'))
        document.documentElement.dataset.theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
